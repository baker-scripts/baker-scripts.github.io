name: Deploy Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am — refresh READMEs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Fetch READMEs from public repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/projects
          for repo in StarrScripts Scripts autodns docker-compose-debugger docs-templates pmm-config qui_workflows RedditModLog; do
            echo "Fetching ${repo}..."
            gh api "repos/baker-scripts/${repo}/readme" --jq '.content' 2>/dev/null | base64 -d > "docs/projects/${repo}.md" 2>/dev/null || echo "# ${repo}" > "docs/projects/${repo}.md"
          done

          bash scripts/fix-readme-links.sh docs/projects

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.1"

      - run: pip install mkdocs-material

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
