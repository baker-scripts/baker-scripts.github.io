<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a12"/>
      <stop offset="0.5" stop-color="#000000"/>
      <stop offset="1" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="50" x2="700" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c4dff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#9d7aff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb74d" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="80" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c4dff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="800" height="200" fill="url(#bg)"/>
  <ellipse cx="400" cy="60" rx="280" ry="80" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Server rack -->
  <rect x="120" y="70" width="140" height="90" rx="8" fill="#0d0d0d" stroke="#1f1f2e" stroke-width="1.5"/>
  <rect x="132" y="82" width="116" height="8" rx="2" fill="#7c4dff" opacity="0.7"/>
  <rect x="132" y="98" width="90" height="6" rx="2" fill="#333"/>
  <rect x="132" y="112" width="100" height="6" rx="2" fill="#333"/>
  <rect x="132" y="126" width="70" height="6" rx="2" fill="#ffb74d" opacity="0.5"/>
  <circle cx="238" cy="86" r="3" fill="#4caf50"/>
  <circle cx="238" cy="102" r="3" fill="#4caf50"/>
  <circle cx="238" cy="116" r="3" fill="#ffb74d"/>
  <!-- Terminal -->
  <rect x="330" y="55" width="140" height="105" rx="8" fill="#0d0d0d" stroke="#1f1f2e" stroke-width="1.5"/>
  <rect x="330" y="55" width="140" height="22" rx="8" fill="#111"/>
  <circle cx="346" cy="66" r="4" fill="#ff5f57"/>
  <circle cx="360" cy="66" r="4" fill="#febc2e"/>
  <circle cx="374" cy="66" r="4" fill="#28c840"/>
  <text x="345" y="100" font-family="monospace" font-size="11" fill="#7c4dff">$ ./starr-sync.sh</text>
  <text x="345" y="118" font-family="monospace" font-size="11" fill="#4caf50"> Radarr updated</text>
  <text x="345" y="136" font-family="monospace" font-size="11" fill="#4caf50"> Sonarr updated</text>
  <text x="345" y="154" font-family="monospace" font-size="11" fill="#ffb74d">’ qui xseed triggered</text>
  <!-- Docker -->
  <rect x="540" y="70" width="140" height="90" rx="8" fill="#0d0d0d" stroke="#1f1f2e" stroke-width="1.5"/>
  <rect x="560" y="90" width="45" height="35" rx="4" fill="none" stroke="#7c4dff" stroke-width="1.5" opacity="0.7"/>
  <rect x="612" y="90" width="45" height="35" rx="4" fill="none" stroke="#7c4dff" stroke-width="1.5" opacity="0.7"/>
  <rect x="560" y="132" width="45" height="20" rx="4" fill="none" stroke="#ffb74d" stroke-width="1.5" opacity="0.5"/>
  <rect x="612" y="132" width="45" height="20" rx="4" fill="none" stroke="#ffb74d" stroke-width="1.5" opacity="0.5"/>
  <!-- Connection lines -->
  <path d="M260 115 H330" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M470 115 H540" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="#7c4dff" opacity="0.6"/>
  <circle cx="720" cy="35" r="1.5" fill="#ffb74d" opacity="0.6"/>
  <circle cx="680" cy="170" r="1" fill="#7c4dff" opacity="0.4"/>
  <circle cx="100" cy="165" r="1" fill="#ffb74d" opacity="0.4"/>
</svg>
